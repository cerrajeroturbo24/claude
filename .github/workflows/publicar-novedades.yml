# Publica cada mañana las novedades pendientes de la Google Sheet en las
# fichas de Google Business Profile. Se puede lanzar a mano desde la pestaña
# Actions -> "Publicar novedades" -> "Run workflow".
name: Publicar novedades

on:
  schedule:
    - cron: "17 7 * * *" # todos los días a las 07:17 UTC (09:17 en Madrid en verano)
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar, prueba (no publica nada) o fichas (lista tus fichas)"
        required: true
        default: publicar
        type: choice
        options: [publicar, prueba, fichas]

permissions:
  contents: read

concurrency:
  group: publicar-novedades

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publicar
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRY_RUN: ${{ inputs.modo == 'prueba' && '1' || '' }}
        run: python3 novedades/publicar.py ${{ inputs.modo == 'fichas' && 'fichas' || '' }}
